<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Mapa de Coropletas</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 20px; font-family: Arial, sans-serif; }
        #map { height: 500px; width: 100%; border: 1px solid #ccc; }
        .info { padding: 10px; margin-bottom: 20px; background: #f0f0f0; border-radius: 5px; }
    </style>
</head>
<body>
    <div class="info">
        <h1>🗺️ Test de Mapa de Coropletas</h1>
        <p>Este es un test para verificar que el mapa de coropletas funciona correctamente.</p>
        <div id="status">Cargando...</div>
    </div>
    
    <div id="map"></div>
    
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // Test simple del mapa de coropletas
        let map;
        let choroplethLayer;
        
        // Datos de prueba
        const testData = {
            'Mexico': 145,
            'United States of America': 89,
            'Spain': 67,
            'Argentina': 54,
            'Colombia': 43
        };
        
        function updateStatus(message) {
            document.getElementById('status').innerHTML = message;
        }
        
        function getColorByCount(count) {
            if (count === 0) return '#f7f7f7';
            if (count < 5) return '#feebe2';
            if (count < 15) return '#fcc5c0';
            if (count < 30) return '#fa9fb5';
            if (count < 50) return '#f768a1';
            if (count < 75) return '#dd3497';
            if (count < 100) return '#ae017e';
            return '#7a0177';
        }
        
        function getCountryStyle(feature) {
            const countryName = feature.properties.name;
            const listenerCount = testData[countryName] || 0;
            
            return {
                fillColor: getColorByCount(listenerCount),
                weight: 1,
                opacity: 0.7,
                color: '#ffffff',
                fillOpacity: listenerCount > 0 ? 0.8 : 0.3
            };
        }
        
        async function initializeTest() {
            try {
                // Inicializar mapa
                map = L.map('map').setView([20, 0], 2);
                
                L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
                    attribution: '© Test Choropleth'
                }).addTo(map);
                
                updateStatus('⏳ Cargando datos GeoJSON...');
                
                // Cargar GeoJSON
                const response = await fetch('./countries.geojson');
                const countriesData = await response.json();
                
                updateStatus('✅ Datos GeoJSON cargados. Creando mapa...');
                
                // Crear capa de coropletas
                choroplethLayer = L.geoJSON(countriesData, {
                    style: getCountryStyle,
                    onEachFeature: function(feature, layer) {
                        const countryName = feature.properties.name;
                        const listenerCount = testData[countryName] || 0;
                        
                        layer.bindPopup(`
                            <strong>${countryName}</strong><br>
                            Oyentes: ${listenerCount}
                        `);
                        
                        layer.on({
                            mouseover: function(e) {
                                e.target.setStyle({
                                    weight: 3,
                                    color: '#0066cc',
                                    fillOpacity: 0.9
                                });
                            },
                            mouseout: function(e) {
                                choroplethLayer.resetStyle(e.target);
                            }
                        });
                    }
                }).addTo(map);
                
                updateStatus('🎉 ¡Mapa de coropletas cargado exitosamente! Los países con datos de prueba aparecen coloreados.');
                
            } catch (error) {
                updateStatus('❌ Error: ' + error.message);
                console.error('Error:', error);
            }
        }
        
        // Inicializar cuando se carga la página
        document.addEventListener('DOMContentLoaded', initializeTest);
    </script>
</body>
</html>
